site_name: "datalab-standalone-tool-plugin-example"
site_description: "A minimal standalone Hello World tool for datalab"
site_url: "https://Matgenix.github.io/datalab-standalone-tool-plugin-example/"
repo_name: "Matgenix/datalab-standalone-tool-plugin-example"
repo_url: "https://github.com/Matgenix/datalab-standalone-tool-plugin-example"

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections

nav:
  - Home: index.md
  - API reference: reference.md

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_root_heading: true
            show_source: false

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
