name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  UV_VERSION: "0.11.x"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - run: uv run pytest -rs -v
      - run: uv run mkdocs build --strict
      - run: uv build
      - name: Verify service-only wheel installation
        run: |
          if [ -f Dockerfile ]; then
            python -m venv /tmp/service-only
            wheel=$(find dist -name '*.whl' -print -quit)
            /tmp/service-only/bin/pip install "${wheel}[service]"
            package=$(basename "$(dirname "$(find src -name service.py -print -quit)")")
            PACKAGE="$package" /tmp/service-only/bin/python -c "import importlib, os, sys; importlib.import_module(os.environ['PACKAGE'] + '.service'); assert 'pydatalab' not in sys.modules"
          fi

  external-image:
    name: External service image
    if: ${{ hashFiles('Dockerfile') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t datalab-standalone-tool:test .

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-extras --dev
      - run: uv run pre-commit run --all-files --show-diff-on-failure
